name: Authz service checks

on:
  push:
    branches:
      - '**'
    paths:
      - 'authz-service/**'
      - '.github/workflows/authz-service-checks.yml'
    tags:
      - 'authz-service/v*'
  pull_request:
    paths:
      - 'authz-service/**'
      - '.github/workflows/authz-service-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: Rego formatting
        run: opa fmt --fail --list authz-service
      - name: Rego strict check
        run: opa check --strict authz-service
      - name: Rego policy tests
        run: opa test authz-service -v --timeout 60s
      - name: Bundle table drift
        run: bun test authz-service/scripts/build-bundle.test.ts
      - name: Generated authz artifacts
        run: bun run frontend/scripts/authz-codegen.ts check

  publish:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/authz-service/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: Install oras
        uses: oras-project/setup-oras@v2
      - name: Write signing key
        run: |
          printf '%s' "${{ secrets.AUTHZ_BUNDLE_SIGNING_KEY }}" > "$RUNNER_TEMP/signing-key.pem"
          chmod 600 "$RUNNER_TEMP/signing-key.pem"
      - name: Build and verify bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#authz-service/v}"
          bun run authz-service/scripts/build-bundle.ts \
            --signing-key "$RUNNER_TEMP/signing-key.pem" \
            --verification-key authz-service/keys/bundle-signing.pub \
            --revision "$VERSION" \
            --out authz-service/dist/authz-bundle.tar.gz
      - name: Publish bundle
        env:
          VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION#authz-service/v}"
          oras login ghcr.io -u "${{ github.actor }}" -p "$GITHUB_TOKEN"
          oras push --artifact-type application/vnd.opa.bundle.v1+json \
            "ghcr.io/${{ github.repository_owner }}/opa-service/authz-bundle:${VERSION}" \
            "authz-service/dist/authz-bundle.tar.gz:application/vnd.opa.bundle.layer.v1+gzip"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.pem"
