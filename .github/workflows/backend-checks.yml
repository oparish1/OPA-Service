name: Backend checks

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
