name: Frontend checks

on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - uses: oras-project/setup-oras@v2
      # `gh` and `oras` keep separate credential stores, so the private contract
      # pull needs its own login with the same read token. The token belongs to
      # the repository owner even when a different collaborator triggers the run.
      - name: Log in to the container registry
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTHZ_POLICY_READ_TOKEN is not set; the private authz-policy release and contract cannot be downloaded." >&2
            exit 1
          fi
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.AUTHZ_POLICY_READ_TOKEN }}
      # Build before the tests so the A18 bundle scan sees `dist/`; the build's
      # `prebuild` hook runs `sync:policy`, which downloads the private
      # authz-policy release and its contract.
      - run: bun run build
        env:
          GH_TOKEN: ${{ secrets.AUTHZ_POLICY_READ_TOKEN }}
      - run: bun run test
      - run: bun run check:catch
      # The generated capability/reason types must match the downloaded
      # contract; this fails when generated.ts is stale.
      - run: bun run check:authz
