name: Frontend checks

on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'gateway/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'gateway/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Build before the tests so the A18 bundle scan sees `dist/`.
      - run: bun run build
      - run: bun run test
