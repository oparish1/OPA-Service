name: Frontend checks

on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'gateway/**'
      - 'authz-service/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'gateway/**'
      - 'authz-service/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/frontend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      # Build before the tests so the A18 bundle scan sees `dist/`; the authz
      # freshness check below still needs OPA. The build's `prebuild` hook runs
      # `sync:policy`, which reads the private authz-policy release.
      - run: bun run build
        env:
          GH_TOKEN: ${{ secrets.AUTHZ_POLICY_READ_TOKEN }}
      - run: bun run test
      - run: bun run check:catch
      # The generated capability/reason types and persona snapshot must match the
      # policy; this fails when either is stale.
      - run: bun run check:authz
