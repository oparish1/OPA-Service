assistant: pi

tiers:
  small:  { provider: pi, model: openrouter/z-ai/glm-5.3-flash }
  medium: { provider: pi, model: openrouter/deepseek/deepseek-v4.1-flash }
  large:  { provider: pi, model: openrouter/deepseek/deepseek-v4.1-flash }

aliases:
'@mini': { provider: pi, model: minimax/MiniMax-M3 }
  figma: { provider: claude, model: claude-sonnet-4-6 }
workflows:
  folder: .archon/workflows          # additional workflows search path
commands:
  folder: .archon/commands           # additional command search path
skills:
  folder: .claude/skills             # additional skills search path
worktree:
  baseBranch: dev
  copyFiles:                         # gitignored files/dirs to copy into worktrees
    - .env                           # nothing is copied unless listed here
    - plans/

docs:
  folder: /docs                     # additional docs search path