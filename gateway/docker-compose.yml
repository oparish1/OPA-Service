# Local gateway stack. APISIX runs in standalone mode and OPA serves the
# policies; the test issuers stand in for the real identity providers so the
# acceptance script never calls Entra, Okta or Google.
#
#   docker compose -f gateway/docker-compose.yml up
#
# The values below are local test placeholders. No real client secret is used.
services:
  apisix:
    image: apache/apisix:3.13.0-debian
    depends_on:
      opa:
        condition: service_healthy
    ports:
      - "9080:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    environment:
      APP_ORIGIN: "https://localhost:5173"
      ENTRA_CLIENT_ID: "test-entra-client"
      ENTRA_CLIENT_SECRET: "test-entra-secret"
      ENTRA_DISCOVERY: "http://entra-issuer:8090/.well-known/openid-configuration"
      ENTRA_API_RESOURCE: "api://test-entra-client"
      ENTRA_TENANT_ID: "tenant-1"
      ENTRA_ISSUER: "http://entra-issuer:8090"
      OKTA_CLIENT_ID: "test-okta-client"
      OKTA_CLIENT_SECRET: "test-okta-secret"
      OKTA_DISCOVERY: "http://okta-issuer:8091/.well-known/openid-configuration"
      OKTA_API_AUDIENCE: "api://default"
      OKTA_ISSUER: "http://okta-issuer:8091"
      GOOGLE_CLIENT_ID: "test-google-client"
      GOOGLE_CLIENT_SECRET: "test-google-secret"
      GOOGLE_DISCOVERY: "http://google-issuer:8092/.well-known/openid-configuration"
      GOOGLE_HOSTED_DOMAIN: "agentic-advantage.com"
      GOOGLE_ISSUER: "https://accounts.google.com"

  # One-shot: pulls the published, signed bundle into a named volume before
  # OPA starts. OPA verifies the signature; this only moves bytes.
  bundle-fetch:
    image: ghcr.io/oras-project/oras:v1.2.0
    command: ["pull", "-o", "/bundles", "ghcr.io/oparish1/opa-service/authz-bundle:0.1.0"]
    user: "0:0"
    restart: "no"
    volumes:
      - bundle-data:/bundles

  # One-shot: the production signing key is not available to the stack, so the
  # merge step below signs its combined bundle with a throwaway key.
  bundle-key:
    image: oven/bun:1
    command: ["run", "/scripts/generate-bundle-key.ts"]
    user: "0:0"
    restart: "no"
    volumes:
      - ./scripts/generate-bundle-key.ts:/scripts/generate-bundle-key.ts:ro
      - bundle-key-data:/ephemeral

  # One-shot: verifies the published bundle against the committed key, adds the
  # decision-log mask, and re-signs. OPA then loads only the combined bundle.
  bundle-merge:
    image: openpolicyagent/opa:1.4.2-debug
    entrypoint: ["/bin/sh", "/scripts/merge-bundle.sh"]
    command:
      - /bundles/authz-service/dist/authz-bundle.tar.gz
      - /keys/bundle-signing.pub
      - /mask/mask.rego
      - /ephemeral/ephemeral.pem
      - /bundles/combined.tar.gz
    user: "0:0"
    restart: "no"
    depends_on:
      bundle-fetch:
        condition: service_completed_successfully
      bundle-key:
        condition: service_completed_successfully
    volumes:
      - bundle-data:/bundles
      - bundle-key-data:/ephemeral
      - ./scripts/merge-bundle.sh:/scripts/merge-bundle.sh:ro
      - ./opa/mask.rego:/mask/mask.rego:ro
      - ../authz-service/keys/bundle-signing.pub:/keys/bundle-signing.pub:ro

  opa:
    # The debug image carries a shell and curl/wget; the static image is
    # scratch-based and cannot run a container healthcheck. This stack is local.
    image: openpolicyagent/opa:1.4.2-debug
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=error
      - --config-file=/config/config.yaml
      - --bundle
      - --verification-key=/ephemeral/ephemeral.pub
      - --signing-alg=ES256
      - /bundles/combined.tar.gz
    # The merge step re-signs the verified published bundle; OPA exits non-zero
    # when that signature fails, so a running container is itself proof it was
    # accepted.
    depends_on:
      bundle-merge:
        condition: service_completed_successfully
    volumes:
      - bundle-data:/bundles:ro
      - bundle-key-data:/ephemeral:ro
      - ./opa/config.yaml:/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8181/health?bundles=true"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "8181:8181"

  entra-issuer:
    image: oven/bun:1
    working_dir: /issuer
    command: ["run", "index.ts"]
    volumes:
      - ./test-issuers:/issuer:ro
    environment:
      PORT: "8090"
      ISSUER_ORIGIN: "http://entra-issuer:8090"
      PROVIDER: "entra"
    ports:
      - "8090:8090"

  okta-issuer:
    image: oven/bun:1
    working_dir: /issuer
    command: ["run", "index.ts"]
    volumes:
      - ./test-issuers:/issuer:ro
    environment:
      PORT: "8091"
      ISSUER_ORIGIN: "http://okta-issuer:8091"
      PROVIDER: "okta"
    ports:
      - "8091:8091"

  google-issuer:
    image: oven/bun:1
    working_dir: /issuer
    command: ["run", "index.ts"]
    volumes:
      - ./test-issuers:/issuer:ro
    environment:
      PORT: "8092"
      ISSUER_ORIGIN: "http://google-issuer:8092"
      PROVIDER: "google"
    ports:
      - "8092:8092"

volumes:
  bundle-data: {}
  bundle-key-data: {}
