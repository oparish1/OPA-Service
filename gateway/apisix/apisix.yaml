  # Capability retrieval is an authenticated read of the caller's own decisions,
  # not a resource authorization, so each route runs openid-connect but not the
  # `opa` plugin; the serverless function queries OPA, rejects a wrong-audience
  # token (openid-connect checks no `aud` on the JWKS path) and returns the map.
  - id: entra-authz-capabilities
    uri: /entra/authz/capabilities
    priority: 10
    labels:
      provider: entra
      audience: "${{ENTRA_API_RESOURCE}}"
      tenant: "${{ENTRA_TENANT_ID}}"
    plugins:
      openid-connect:
        client_id: "${{ENTRA_CLIENT_ID}}"
        client_secret: "${{ENTRA_CLIENT_SECRET}}"
        discovery: "${{ENTRA_DISCOVERY}}"
        bearer_only: true
        use_jwks: true
        realm: entra
        claim_validator:
          issuer:
            valid_issuers:
              - "${{ENTRA_ISSUER}}"
      limit-count:
        count: 20
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        policy: local
      cors:
        allow_origins: "${{APP_ORIGIN}}"
        allow_methods: "GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS"
        allow_headers: "Authorization,Content-Type,Accept,X-Requested-With"
        expose_headers: "Content-Type,Content-Length,Date,Cache-Control,ETag,WWW-Authenticate,Retry-After,X-Request-ID"
        max_age: 3600
        allow_credential: false
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      serverless-post-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local http = require("resty.http")
              local helper = require("apisix.plugins.opa.helper")
              local body = helper.build_opa_input({with_route = true}, ctx, "http")
              local httpc = http.new()
              httpc:set_timeout(3000)
              local res, err = httpc:request_uri("http://opa:8181/v1/data/authz/v1/gateway/entra", {
                method = "POST",
                body = core.json.encode(body),
                headers = {["Content-Type"] = "application/json"},
              })
              if not res then
                core.log.error("capabilities query failed: ", err)
                core.response.exit(503, {error = "capabilities_unavailable"})
                return
              end
              local data = core.json.decode(res.body)
              if not data or not data.result or not data.result.capabilities then
                core.log.error("capabilities query returned no result")
                core.response.exit(503, {error = "capabilities_unavailable"})
                return
              end
              local result = data.result
              local subject = ""
              if result.headers then
                subject = result.headers["X-User-Subject"] or result.headers["X-Auth-Subject"] or ""
              end
              for _, reason in ipairs(result.reasons or {}) do
                if reason == "wrong_audience" then
                  core.response.set_header("Content-Type", "application/json")
                  core.response.set_header("X-Auth-Provider", "entra")
                  core.response.set_header("X-Auth-Subject", subject)
                  core.response.set_header("X-Auth-Decision", "deny")
                  core.response.set_header("X-Auth-Reason", "wrong_audience")
                  core.response.exit(401, {error = "unauthorized"})
                  return
                end
              end
              core.response.set_header("Content-Type", "application/json")
              core.response.set_header("X-Auth-Provider", "entra")
              core.response.set_header("X-Auth-Subject", subject)
              core.response.set_header("X-Auth-Decision", "allow")
              core.response.set_header("X-Auth-Reason", "")
              core.response.exit(200, result.capabilities)
              return
            end
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:1980": 1

